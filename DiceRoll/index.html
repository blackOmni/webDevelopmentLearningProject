<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roll Dice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- Game Board / Dice Viewport -->
      <div class="user-react-part">
        <h1>Dice Roll</h1>
        <div>
          <div class="dice-value active">1</div>
          <div class="dice-value">2</div>
          <div class="dice-value">3</div>
          <div class="dice-value">4</div>
          <div class="dice-value">5</div>
          <div class="dice-value">6</div>
        </div>
        <button id="roll-btn">Roll Dice</button>
      </div>

      <!-- Multiplayer and Scoring System Section -->
      <div class="multiplayer-section">
        <!-- Step 1: Reordered Proportional Setup View -->
        <div id="setup-view" class="setup-row-container">
          <!-- 25% Left Element -->
          <div class="input-group width-25">
            <label for="player-count">Players</label>
            <input type="number" id="player-count" min="2" max="6" value="2" />
          </div>
          <!-- 50% Center Element -->
          <div class="button-group width-50">
            <button id="start-game-btn">Start</button>
          </div>
          <!-- 25% Right Element -->
          <div class="input-group width-25">
            <label for="target-score">To Win</label>
            <input
              type="number"
              id="target-score"
              min="10"
              max="500"
              value="50"
            />
          </div>
        </div>

        <!-- Step 2: Scoreboard View -->
        <div id="score-view" class="score-container hidden">
          <div id="turn-announcer" class="turn-banner">Player 1's Turn</div>
          <div id="players-grid" class="players-grid"></div>
        </div>
      </div>

      <!-- Chronological Roll Tracker Log (No Scroll) -->
      <div class="dice-history">
        <div class="history-header">History Log</div>
        <div id="history-box" class="history-grid"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
