<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="mainContainer">
      <header>
        <h2 class="heading-one">Tip Calculator</h2>
        <p class="para1">
          Enter the bill amount and tip percentage to calculate the total.
        </p>
      </header>

      <form id="tipForm" class="calculator-form">
        <div class="input-group">
          <!-- Anchor span added to dynamically swap currency text -->
          <label for="billAmount"
            >Bill Amount (<span id="billSign">$</span>)</label
          >
          <input type="number" id="billAmount" min="0" step="0.01" required />
        </div>

        <div class="input-group">
          <label for="tipPercentage">Tip Percentage (%)</label>
          <input type="number" id="tipPercentage" min="0" required />
        </div>

        <div class="button-group">
          <select id="currencySelect">
            <option value="$">USD ($)</option>
            <option value="₹">INR (₹)</option>
            <option value="€">EUR (€)</option>
            <option value="£">GBP (£)</option>
          </select>
          <button type="submit" id="calculateBtn">Calculate</button>
          <button type="reset" id="reSetBtn">Reset</button>
        </div>
      </form>

      <footer class="result-box">
        <span>Total:</span>
        <span id="totalDisplay">$0.00</span>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
