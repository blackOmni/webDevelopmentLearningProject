<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="main-heading">Age Calculator</h1>

      <form id="ageForm">
        <div class="form-group">
          <label for="DateOfBirth">Enter your DOB</label>
          <input type="date" id="DateOfBirth" required />
        </div>

        <!-- New button layout wrapper -->
        <div class="button-group">
          <button type="submit" class="btn-submit">Calculate Age</button>
          <button type="reset" class="btn-reset">Reset</button>
        </div>
      </form>

      <div class="container-footer">Enter your age above</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
